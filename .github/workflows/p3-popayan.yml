name: P3 localizacion Popayan (simulacion)

on:
  push:
    paths:
      - "demo-localizacion-drones-popayan/**"
      - ".github/workflows/p3-popayan.yml"
  pull_request:
    paths:
      - "demo-localizacion-drones-popayan/**"
      - ".github/workflows/p3-popayan.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-localizacion-drones-popayan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Lint informativo (no bloquea)
        run: ruff check . --exit-zero
      - name: Pruebas (incluye integracion, datos simulados)
        run: pytest -q
